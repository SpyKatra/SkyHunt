name: Mettre à jour le registre canadien

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'   # chaque lundi
  push:
    branches: [main]
    paths: ['tools/build_registre.py', '.github/workflows/registre.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le registre de Transport Canada
        run: |
          curl -fsSL -A "SkyHunt-registre/1.0" -o ccarcsdb.zip \
            https://wwwapps.tc.gc.ca/saf-sec-sur/2/ccarcs-riacc/download/ccarcsdb.zip
          unzip -o ccarcsdb.zip -d ccar
          ls -la ccar
          echo "----- carslayout.txt -----"
          iconv -f latin1 -t utf-8 ccar/carslayout.txt | head -120 || true
          echo "----- carscurr.txt (3 lignes) -----"
          iconv -f latin1 -t utf-8 ccar/carscurr.txt | head -3 || true
      - name: Construire web/data/registre-ca.json
        run: python3 tools/build_registre.py ccar
      - name: Enregistrer si changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/registre-ca.json
          git diff --cached --quiet || git commit -m "Registre canadien mis à jour ($(date -u +%F))"
          git push
