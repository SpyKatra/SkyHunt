<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SkyHunt" />
  <title>SkyHunt — prototype</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=0.4.6" />
</head>
<body>
  <main id="app">
    <!-- ============ Chasser (caméra) ============ -->
    <section id="view-camera" class="view active">
      <div id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>

      <div id="hud-top">
        <div id="status" class="panel">Touchez « Démarrer la caméra »</div>
        <div id="hud-level" class="panel"><span id="hud-lvl">Niv. 1</span><div class="mini-bar"><i id="hud-xp"></i></div></div>
      </div>

      <div id="debug" class="panel hidden">
        <div class="row"><span>Confiance</span><b id="d-conf">–</b></div>
        <div class="row"><span>Taille</span><b id="d-size">–</b></div>
        <div class="row"><span>Netteté</span><b id="d-sharp">–</b></div>
        <div class="row"><span>Luminosité</span><b id="d-bright">–</b></div>
        <div class="row"><span>Moiré (écran)</span><b id="d-moire">–</b></div>
        <div class="row"><span>Écran détecté</span><b id="d-screen">–</b></div>
        <div class="row"><span>Analyse</span><b id="d-ms">–</b></div>
        <details>
          <summary>Régler les seuils</summary>
          <label>Confiance min <output id="o-conf"></output>
            <input id="s-conf" type="range" min="0.2" max="0.9" step="0.05" /></label>
          <label>Taille min <output id="o-size"></output>
            <input id="s-size" type="range" min="0.05" max="0.5" step="0.01" /></label>
          <label>Netteté min <output id="o-sharp"></output>
            <input id="s-sharp" type="range" min="0" max="8000" step="50" /></label>
          <button id="reset-thresholds" class="small">Valeurs par défaut</button>
        </details>
      </div>

      <div id="start-wrap">
        <img src="icon-192.png" alt="" class="start-logo" />
        <h1>SkyHunt</h1>
        <p class="tagline">Photographie de vrais avions. Construis ta flotte.</p>
        <button id="start" class="primary">Démarrer la caméra</button>
        <p class="hint">Autorise la caméra et la position quand Safari le demande.</p>
      </div>

      <div id="controls">
        <button id="toggle-debug" class="small">Diagnostic</button>
        <button id="shutter" aria-label="Prendre la photo" disabled><span></span></button>
        <span class="spacer"></span>
      </div>

      <div id="toast" class="hidden"></div>
    </section>

    <!-- ============ Cartes (collection) ============ -->
    <section id="view-cards" class="view scroll">
      <header class="page-head">
        <h1>Mes cartes</h1>
        <p id="cards-sub"></p>
        <div class="chips" id="cards-filter">
          <button class="chip active" data-filter="cards">Cartes</button>
          <button class="chip" data-filter="album">Album</button>
          <button class="chip" data-filter="refused">Refusées</button>
        </div>
      </header>
      <div id="cards-content"></div>
    </section>

    <!-- ============ Carte du monde ============ -->
    <section id="view-map" class="view">
      <div id="map"></div>
      <div id="map-info" class="panel"></div>
    </section>

    <!-- ============ Classement ============ -->
    <section id="view-ranks" class="view scroll">
      <div id="ranks-content"></div>
    </section>

    <!-- ============ Profil ============ -->
    <section id="view-profile" class="view scroll">
      <div id="profile-content"></div>
    </section>
  </main>

  <nav id="tabs">
    <button data-view="camera" class="tab active"><span class="ti">◎</span>Chasser</button>
    <button data-view="cards" class="tab"><span class="ti">▦</span><span id="tab-cards">Cartes</span></button>
    <button data-view="map" class="tab"><span class="ti">⌖</span>Carte</button>
    <button data-view="ranks" class="tab"><span class="ti">♛</span>Classement</button>
    <button data-view="profile" class="tab"><span class="ti">☺</span>Profil</button>
  </nav>

  <!-- Fiche d'identification -->
  <div id="identify" class="sheet-wrap hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Quel avion as-tu capturé ?</h2>
        <button class="close" data-close="identify" aria-label="Fermer">✕</button>
      </div>
      <img id="identify-photo" alt="" />
      <div id="identify-auto" class="auto hidden"></div>
      <input id="identify-search" type="search" placeholder="Rechercher (ex. Dash 8, A320, Saab)" autocomplete="off" />
      <input id="identify-reg" type="text" placeholder="Immatriculation (facultatif, ex. C-GKUG)" autocapitalize="characters" autocomplete="off" />
      <div id="identify-list"></div>
      <button id="identify-unknown" class="ghost">Je ne sais pas — garder en « Avion mystère »</button>
    </div>
  </div>

  <!-- Révélation de la carte -->
  <div id="reveal" class="hidden">
    <div id="reveal-burst"></div>
    <div id="reveal-card"></div>
    <div id="reveal-details"></div>
    <button id="reveal-ok" class="primary">Continuer</button>
  </div>

  <!-- Détail d'une carte -->
  <div id="detail" class="sheet-wrap hidden">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="detail-title"></h2>
        <button class="close" data-close="detail" aria-label="Fermer">✕</button>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/tesseract/tesseract.min.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <!-- La bibliothèque TFLite se termine par « exports.tfweb = … » : on lui fournit un objet vide. -->
  <script>var exports = {};</script>
  <script src="vendor/tflite/tflite_web_api_client.js"></script>
  <script type="module" src="app.js?v=0.4.6"></script>
</body>
</html>
